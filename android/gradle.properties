org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.enableJetifier=true

# AGP 9+ defaults to a new build.gradle DSL and built-in Kotlin support
# that conflict with our explicit `kotlin-android` plugin application.
# Opting out keeps the existing (Groovy) DSL and plugin setup working
# without needing to rewrite build.gradle in the new syntax.
android.newDsl=false
android.builtInKotlin=false
